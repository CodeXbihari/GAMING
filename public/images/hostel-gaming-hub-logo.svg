<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220" fill="none">
  <defs>
    <linearGradient id="lime" x1="58" y1="17" x2="229" y2="144" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4FF86"/><stop offset=".5" stop-color="#C6FF00"/><stop offset="1" stop-color="#7CB900"/>
    </linearGradient>
    <linearGradient id="metal" x1="113" y1="24" x2="183" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F7F2"/><stop offset="1" stop-color="#9EA79C"/>
    </linearGradient>
    <pattern id="grain" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".4" fill="#F5F7F2" fill-opacity=".16"/><circle cx="3.5" cy="3.5" r=".35" fill="#C6FF00" fill-opacity=".18"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Orbiting console emblem -->
  <path d="M42 77c21-42 79-61 135-43 24 8 43 22 55 40" stroke="url(#lime)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M67 92c-18 14-29 24-25 34 5 12 37 12 65 6" stroke="#C6FF00" stroke-opacity=".55" stroke-width="2"/>
  <path d="m226 21 5 12 12 5-12 5-5 12-5-12-12-5 12-5 5-12Z" fill="#C6FF00" filter="url(#glow)"/>
  <path d="m75 38 76-25 75 25v50l-75 37-75-37V38Z" fill="#0B0F0B" stroke="#C6FF00" stroke-width="2.4"/>
  <path d="m75 38 76-25 75 25v50l-75 37-75-37V38Z" fill="url(#grain)"/>
  <path d="m88 44 63-20 62 20v37l-62 30-63-30V44Z" stroke="#F5F7F2" stroke-opacity=".22"/>
  <path d="M102 48h98v44h-98z" fill="#0B0F0B" stroke="#9EA79C" stroke-opacity=".38"/>
  <!-- Gamepad mark -->
  <path d="M117 64c1-5 5-8 10-8h39c5 0 9 3 10 8l8 20c2 7-6 12-12 7l-9-7h-34l-9 7c-6 5-14 0-12-7l9-20Z" fill="url(#metal)" stroke="#F5F7F2" stroke-opacity=".7"/>
  <path d="M129 65v15m-7.5-7.5h15" stroke="#0B0F0B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="164" cy="65" r="3.4" fill="#C6FF00"/><circle cx="171" cy="72" r="3.4" fill="#C6FF00"/><circle cx="164" cy="79" r="3.4" fill="#C6FF00"/><circle cx="157" cy="72" r="3.4" fill="#C6FF00"/>

  <!-- Stacked wordmark echoing the supplied badge composition -->
  <path d="M35 145h62m106 0h62" stroke="#C6FF00" stroke-opacity=".66" stroke-width="2"/>
  <text x="150" y="157" text-anchor="middle" fill="#F5F7F2" stroke="#080A08" stroke-width="5" paint-order="stroke" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" letter-spacing=".5">HOSTEL</text>
  <text x="150" y="192" text-anchor="middle" fill="#C6FF00" stroke="#080A08" stroke-width="5" paint-order="stroke" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="900" letter-spacing="1.5">GAMING HUB</text>
  <path d="M75 207h56l19 8 19-8h56" stroke="#C6FF00" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
